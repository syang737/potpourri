<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#FFF5EC"/>
  <!-- Steam wisps -->
  <path d="M22 16 C22 12, 26 10, 26 6" stroke="#FFB89A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 14 C32 10, 36 8, 36 4" stroke="#FFB89A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M42 16 C42 12, 38 10, 38 6" stroke="#FFB89A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Pot rim -->
  <ellipse cx="32" cy="24" rx="20" ry="5" fill="#FF8B5E"/>
  <!-- Pot body -->
  <path d="M12 24 C12 24, 14 52, 32 52 C50 52, 52 24, 52 24" fill="#FF8B5E"/>
  <!-- Pot body highlight -->
  <path d="M16 26 C16 26, 18 48, 32 48 C36 48, 39 45, 41 40" stroke="#FFB89A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Pot rim highlight -->
  <ellipse cx="32" cy="24" rx="16" ry="3" fill="#FFB89A" opacity="0.4"/>
  <!-- Face - eyes -->
  <circle cx="25" cy="34" r="2.5" fill="#4A3728"/>
  <circle cx="39" cy="34" r="2.5" fill="#4A3728"/>
  <!-- Eye shine -->
  <circle cx="26" cy="33" r="1" fill="white"/>
  <circle cx="40" cy="33" r="1" fill="white"/>
  <!-- Smile -->
  <path d="M27 40 C29 43, 35 43, 37 40" stroke="#4A3728" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheek blush -->
  <ellipse cx="21" cy="38" rx="3" ry="2" fill="#FFB89A" opacity="0.6"/>
  <ellipse cx="43" cy="38" rx="3" ry="2" fill="#FFB89A" opacity="0.6"/>
  <!-- Flowers/items poking out of pot -->
  <circle cx="22" cy="18" r="3" fill="#E8D5F5"/>
  <circle cx="32" cy="16" r="3" fill="#D4F0E0"/>
  <circle cx="42" cy="18" r="3" fill="#FFF5CC"/>
  <circle cx="22" cy="18" r="1.5" fill="#D4B8E8"/>
  <circle cx="32" cy="16" r="1.5" fill="#A8DEB8"/>
  <circle cx="42" cy="18" r="1.5" fill="#FFE88A"/>
</svg>
